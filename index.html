<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hamza Games</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            text-align: center;
        }

        header {
            padding: 60px 20px;
            background: linear-gradient(135deg, #111a3a, #25104d);
        }

        header h1 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        header p {
            font-size: 20px;
            color: #bfc7ff;
        }

        .games {
            padding: 45px 20px;
        }

        .games h2 {
            font-size: 35px;
            margin-bottom: 30px;
        }

        .game-card {
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            background: #151d38;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .game-card h3 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .game-card p {
            color: #c8c8c8;
            margin-bottom: 25px;
        }

        .play-button {
            display: inline-block;
            padding: 14px 35px;
            border-radius: 30px;
            background: #6c5ce7;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .play-button:hover {
            background: #8c7cff;
        }

        footer {
            margin-top: 50px;
            padding: 25px;
            background: #070b16;
            color: #888;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎮 Hamza Games</h1>
        <p>Welcome to my gaming world!</p>
    </header>

    <section class="games">

        <h2>My Games</h2>

        <div class="game-card">

            <h3>Hamza Ibrahim Game 🎯</h3>

            <p>A game created by Hamza.</p>

            <a
                href="https://planet.mblock.cc/project/8267714"
                class="play-button"
                target="_blank">
                ▶ Play Game
            </a>

        </div>

    </section>

    <footer>
        © 2026 Hamza Games
    </footer>

</body>
</html>
